name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build-exe -O ReleaseSmall -target x86_64-windows-gnu --name slpatch slpatch.zig

      - name: Check output
        run: |
          test -s slpatch.exe
          head -c 2 slpatch.exe | od -An -c | grep -q 'M   Z'
          ls -l slpatch.exe

      - name: Checksum
        run: |
          sha256sum slpatch.exe | tee slpatch.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: slpatch-windows-x64
          path: |
            slpatch.exe
            slpatch.exe.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slpatch.exe
            slpatch.exe.sha256
          generate_release_notes: true
